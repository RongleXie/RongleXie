name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/RongleXie")

          REPOS=$(echo "$USER_DATA" | jq -r '.public_repos')
          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers')

          STARS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/RongleXie/repos?per_page=100&type=owner" | \
            jq '[.[].stargazers_count] | add // 0')

          if [ "$STARS" -ge 1000 ]; then
            STARS_FORMATTED=$(echo "scale=1; $STARS / 1000" | bc | sed 's/\.0$//')k+
          else
            STARS_FORMATTED="${STARS}+"
          fi

          # Fetch total commits using Search Commits API
          COMMITS_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.cloak-preview" \
            "https://api.github.com/search/commits?q=author:RongleXie&per_page=1")

          TOTAL_COMMITS=$(echo "$COMMITS_DATA" | jq -r '.total_count // 0')

          if [ "$TOTAL_COMMITS" -ge 1000 ]; then
            COMMITS_FORMATTED=$(echo "scale=1; $TOTAL_COMMITS / 1000" | bc | sed 's/\.0$//')k+
          else
            COMMITS_FORMATTED="${TOTAL_COMMITS}+"
          fi

          # Fetch profile views from komarev API
          VIEWS=$(curl -s "https://komarev.com/ghpvc/?username=RongleXie&format=compact" | grep -oP '\d+' | head -1)
          VIEWS=${VIEWS:-0}

          echo "REPOS=$REPOS" >> $GITHUB_ENV
          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV
          echo "STARS_FORMATTED=$STARS_FORMATTED" >> $GITHUB_ENV
          echo "COMMITS_FORMATTED=$COMMITS_FORMATTED" >> $GITHUB_ENV
          echo "VIEWS=$VIEWS" >> $GITHUB_ENV

          echo "::notice::Stars: $STARS_FORMATTED, Repos: $REPOS, Followers: $FOLLOWERS, Commits: $COMMITS_FORMATTED, Views: $VIEWS"

      - name: Download Shields.io Badges
        run: |
          mkdir -p stats

          curl -sL "https://img.shields.io/badge/🌟_Stars-${{ env.STARS_FORMATTED }}-3B82F6?style=for-the-badge&labelColor=0D1117" -o stats/stars.svg
          curl -sL "https://img.shields.io/badge/📦_Repos-${{ env.REPOS }}-0D1117?style=for-the-badge&logo=github" -o stats/repos.svg
          curl -sL "https://img.shields.io/github/followers/RongleXie?label=Followers&style=for-the-badge&logo=github&labelColor=1E3A8A&color=0D1117" -o stats/followers.svg
          curl -sL "https://img.shields.io/badge/💻_Commits-${{ env.COMMITS_FORMATTED }}-06B6D4?style=for-the-badge&logo=git" -o stats/commits.svg
          curl -sL "https://komarev.com/ghpvc/?username=RongleXie&color=3B82F6&style=for-the-badge" -o stats/views.svg

      - name: Update README.md
        run: |
          # Replace badge URLs with local file paths
          sed -i 's|https://img.shields.io/github/stars/RongleXie?affiliations=OWNER&style=for-the-badge&color=3B82F6&labelColor=0D1117|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/stars.svg|g' README.md
          sed -i 's|https://img.shields.io/badge/📦_Repos-[^&"]*|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/repos.svg|g' README.md
          sed -i 's|https://img.shields.io/github/followers/RongleXie?label=Followers&style=for-the-badge&logo=github&labelColor=1E3A8A|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/followers.svg|g' README.md
          sed -i 's|https://img.shields.io/badge/💻_Commits-[^&"]*|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/commits.svg|g' README.md
          sed -i 's|https://komarev.com/ghpvc/?username=RongleXie&color=3B82F6&style=for-the-badge&label=Views|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/views.svg|g' README.md

          echo "::group::README Changes"
          git diff README.md || echo "No changes made"
          echo "::endgroup::"

      - name: Commit changes
        run: |
          git config --global user.email "ronglexie@gmail.com"
          git config --global user.name "RongleXie"
          git add stats/ README.md

          if git diff --staged --quiet; then
            echo "::notice::No changes to commit"
          else
            git commit -m "chore: update stats badges"
            git pull --rebase origin main
            git push
            echo "::notice::Successfully updated stats"
          fi