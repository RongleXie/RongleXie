name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/RongleXie")

          REPOS=$(echo "$USER_DATA" | jq -r '.public_repos')
          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers')

          STARS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/RongleXie/repos?per_page=100&type=owner" | \
            jq '[.[].stargazers_count] | add // 0')

          if [ "$STARS" -ge 1000 ]; then
            STARS_FORMATTED=$(echo "scale=1; $STARS / 1000" | bc | sed 's/\.0$//')k+
          else
            STARS_FORMATTED="${STARS}+"
          fi

          # Fetch total commits using Search Commits API
          COMMITS_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.cloak-preview" \
            "https://api.github.com/search/commits?q=author:RongleXie&per_page=1")

          TOTAL_COMMITS=$(echo "$COMMITS_DATA" | jq -r '.total_count // 0')

          if [ "$TOTAL_COMMITS" -ge 1000 ]; then
            COMMITS_FORMATTED=$(echo "scale=1; $TOTAL_COMMITS / 1000" | bc | sed 's/\.0$//')k+
          else
            COMMITS_FORMATTED="${TOTAL_COMMITS}+"
          fi

          echo "REPOS=$REPOS" >> $GITHUB_ENV
          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV
          echo "STARS_FORMATTED=$STARS_FORMATTED" >> $GITHUB_ENV
          echo "COMMITS_FORMATTED=$COMMITS_FORMATTED" >> $GITHUB_ENV

          echo "::notice::Stars: $STARS_FORMATTED, Repos: $REPOS, Followers: $FOLLOWERS, Commits: $COMMITS_FORMATTED"

      - name: Update README.md
        run: |
          # Replace badge src with live Shields.io URLs
          sed -i "s|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/stars.svg|https://img.shields.io/github/stars/RongleXie?affiliations=OWNER\&style=for-the-badge\&color=3B82F6\&labelColor=0D1117|g" README.md
          sed -i "s|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/repos.svg|https://img.shields.io/badge/📦_Repos-${{ env.REPOS }}-0D1117?style=for-the-badge\&logo=github|g" README.md
          sed -i "s|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/followers.svg|https://img.shields.io/github/followers/RongleXie?label=Followers\&style=for-the-badge\&logo=github\&labelColor=1E3A8A|g" README.md
          sed -i "s|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/commits.svg|https://img.shields.io/badge/💻_Commits-${{ env.COMMITS_FORMATTED }}-06B6D4?style=for-the-badge\&logo=git|g" README.md
          sed -i "s|https://raw.githubusercontent.com/RongleXie/RongleXie/main/stats/views.svg|https://komarev.com/ghpvc/?username=RongleXie\&color=3B82F6\&style=for-the-badge\&label=Views|g" README.md

          echo "::group::README Changes"
          git diff README.md || echo "No changes made"
          echo "::endgroup::"

      - name: Commit changes
        run: |
          git config --global user.email "ronglexie@gmail.com"
          git config --global user.name "RongleXie"
          git add README.md

          if git diff --staged --quiet; then
            echo "::notice::No changes to commit"
          else
            git commit -m "chore: update stats badges"
            git pull --rebase origin main
            git push
            echo "::notice::Successfully updated stats"
          fi